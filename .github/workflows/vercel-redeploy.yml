name: Auto Redeploy Vercel

on:
  schedule:
    # 每隔 6 小时执行一次（UTC时间）
    - cron: '0 */6 * * *'
  # 手动触发
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST \
            "${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}'
